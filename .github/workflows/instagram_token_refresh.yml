name: Instagram Token Auto-Refresh

on:
  schedule:
    # Every Monday at 06:00 UTC (before the daily 11h run)
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh Instagram long-lived token
        id: refresh
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          NEW_TOKEN=$(python3 - <<'EOF'
import urllib.request, json, sys, os

token = os.environ["INSTAGRAM_ACCESS_TOKEN"]
url = (
    "https://graph.instagram.com/refresh_access_token"
    f"?grant_type=ig_refresh_token&access_token={token}"
)
try:
    with urllib.request.urlopen(url, timeout=30) as r:
        data = json.loads(r.read())
    new_token = data.get("access_token", "")
    expires_in = data.get("expires_in", 0)
    days = expires_in // 86400
    print(f"Token refreshed — valid for {days} days", file=sys.stderr)
    print(new_token)
except Exception as e:
    print(f"ERREUR refresh: {e}", file=sys.stderr)
    sys.exit(1)
EOF
)
          if [ -z "$NEW_TOKEN" ]; then
            echo "Token vide — abort"
            exit 1
          fi
          echo "new_token=$NEW_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Update INSTAGRAM_ACCESS_TOKEN secret
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh secret set INSTAGRAM_ACCESS_TOKEN \
            --repo "${{ github.repository }}" \
            --body "${{ steps.refresh.outputs.new_token }}"
          echo "Secret mis a jour avec succes"
