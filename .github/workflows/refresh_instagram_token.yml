name: Refresh Instagram Token

on:
  schedule:
    # Every 2 days at 06:00 UTC — well before any expiry
    - cron: '0 6 */2 * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh Instagram long-lived token
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          # Instagram Graph API (business) uses Facebook User Tokens — refresh via fb_exchange_token
          RESPONSE=$(curl -s "https://graph.facebook.com/v25.0/oauth/access_token?grant_type=fb_exchange_token&client_id=${FB_APP_ID}&client_secret=${FB_APP_SECRET}&fb_exchange_token=${INSTAGRAM_ACCESS_TOKEN}")
          echo "API keys in response: $(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(list(d.keys()))")"
          NEW_TOKEN=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('access_token',''))")
          if [ -n "$NEW_TOKEN" ] && [ "$NEW_TOKEN" != "None" ] && [ "$NEW_TOKEN" != "" ]; then
            echo "$NEW_TOKEN" | gh secret set INSTAGRAM_ACCESS_TOKEN -R ${{ github.repository }}
            echo "Token refreshed OK (new 60-day Facebook long-lived token)"
          else
            echo "ERROR: Token refresh failed"
            echo "Response was: $RESPONSE"
            exit 1
          fi
