name: Debug Pinterest Account
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check boards and recent pins
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
        run: |
          pip install requests -q
          python3 -c "
import requests, json, os
token = os.environ['PINTEREST_ACCESS_TOKEN']
headers = {'Authorization': f'Bearer {token}'}

# Try boards
r = requests.get('https://api.pinterest.com/v5/boards?page_size=25', headers=headers)
print('BOARDS STATUS:', r.status_code)
if r.status_code == 200:
    for b in r.json().get('items', []):
        print(f'  {b[\"id\"]} | {b[\"name\"]}')
else:
    print(r.text)

# Try user account with different approach
r2 = requests.get('https://api.pinterest.com/v5/user_account', headers=headers)
print('USER STATUS:', r2.status_code, r2.text[:200])
"
