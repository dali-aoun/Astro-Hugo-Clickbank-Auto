name: Instagram Engagement (Comment Replies)

on:
  schedule:
    # Runs once per day at 14:00 UTC (after the midday publishing run)
    - cron: "0 14 * * *"
  workflow_dispatch:

jobs:
  engage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run engagement bot
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: python ig_engagement.py

      - name: Commit engagement log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ig_engagement_done.json ig_engagement_log.txt 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: ig engagement done [skip ci]"
          git push || true
